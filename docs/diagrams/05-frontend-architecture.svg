</g>

<line x1="180" y1="114" x2="198" y2="114" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow5)"/>
<line x1="330" y1="114" x2="348" y2="114" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow5)"/>
<line x1="500" y1="114" x2="518" y2="114" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow5)"/>
<line x1="670" y1="114" x2="688" y2="114" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow5)"/>

<rect x="350" y="168" width="200" height="48" rx="8" fill="#FFFFFF" stroke="#185FA5"/>
<text x="450" y="188" text-anchor="middle" font-weight="bold" fill="#042C53">ResultScreen</text>
<text x="450" y="204" text-anchor="middle" fill="#0C447C" font-size="10">transcrição + perguntas (sem mapeamento posicional)</text>
<line x1="790" y1="142" x2="790" y2="192" stroke="#5F5E5A" stroke-width="1.4"/>
<line x1="790" y1="192" x2="552" y2="192" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow5)"/>

<text x="50" y="245" font-size="10.5" fill="#B45309" font-style="italic">Regra transversal: recording_screen, processing_screen e home_screen nunca fabricam resultado fictício — erro real + retry; fallback demo só atrás de SCITECH_DEMO_MODE.</text>

<!-- Services -->
<rect x="30" y="264" width="880" height="150" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
