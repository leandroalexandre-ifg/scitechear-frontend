<text x="611" y="336" text-anchor="middle" fill="#3B6D11">record · WAV 16kHz mono</text>
<text x="611" y="350" text-anchor="middle" fill="#3B6D11">background_service (Android)</text>

<rect x="698" y="298" width="150" height="60" rx="7" fill="#FFFFFF" stroke="#3B6D11"/>
<text x="773" y="318" text-anchor="middle" font-weight="bold" fill="#173404">offline_service</text>
<text x="773" y="336" text-anchor="middle" fill="#3B6D11">LocalResultCache</text>
<text x="773" y="350" text-anchor="middle" fill="#3B6D11">demo atrás de gate</text>
</g>

<line x1="450" y1="216" x2="450" y2="262" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#arrow5)"/>

<!-- config + models -->
<rect x="30" y="432" width="420" height="100" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
