<text x="425" y="126" fill="#0C447C" font-size="10">participantes + amostra</text>

<rect x="520" y="86" width="150" height="56" rx="8" fill="#FFFFFF" stroke="#185FA5"/>
<text x="595" y="110" font-weight="bold" fill="#042C53">RecordingScreen</text>
