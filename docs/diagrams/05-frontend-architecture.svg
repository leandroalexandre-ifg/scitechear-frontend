<g font-size="11.5" text-anchor="middle">
<rect x="50" y="86" width="130" height="56" rx="8" fill="#FFFFFF" stroke="#185FA5"/>
<text x="115" y="110" font-weight="bold" fill="#042C53">AuthScreen</text>
<text x="115" y="126" fill="#0C447C" font-size="10">login/cadastro</text>

<rect x="200" y="86" width="130" height="56" rx="8" fill="#FFFFFF" stroke="#185FA5"/>
