<text x="50" y="490" font-size="11" fill="#444441">via --dart-define (default 10.0.2.2:8000)</text>
<text x="50" y="510" font-size="11" fill="#444441">SCITECH_DEMO_MODE — gate de compilação</text>

<rect x="470" y="432" width="440" height="100" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="490" y="454" font-size="13" font-weight="bold" fill="#26215C">lib/models</text>
