<svg width="960" height="620" viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
<defs>
<marker id="arrow5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="960" height="620" fill="#FFFFFF"/>
<text x="30" y="32" font-size="18" font-weight="bold" fill="#111827">Frontend — Fluxo de Telas e Serviços (scitechear)</text>

<!-- Screens flow -->
<rect x="30" y="52" width="900" height="128" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="50" y="74" font-size="13.5" font-weight="bold" fill="#042C53">lib/screens — fluxo do usuário</text>

<g font-size="11.5" text-anchor="middle">
<rect x="50" y="86" width="128" height="52" rx="8" fill="#FFFFFF" stroke="#185FA5"/>
<text x="114" y="108" font-weight="bold" fill="#042C53">AuthScreen</text>
<text x="114" y="124" fill="#0C447C" font-size="10">login/cadastro · 403 no campo</text>

<rect x="196" y="86" width="128" height="52" rx="8" fill="#FFFFFF" stroke="#185FA5"/>
<text x="260" y="108" font-weight="bold" fill="#042C53">HomeScreen</text>
<text x="260" y="124" fill="#0C447C" font-size="10">histórico · reabrir · semeia</text>

<rect x="342" y="86" width="140" height="52" rx="8" fill="#FFFFFF" stroke="#185FA5"/>
<text x="412" y="108" font-weight="bold" fill="#042C53">MeetingSetupScreen</text>
<text x="412" y="124" fill="#0C447C" font-size="10">título · seleção</text>

<rect x="500" y="86" width="128" height="52" rx="8" fill="#FFFFFF" stroke="#185FA5"/>
<text x="564" y="108" font-weight="bold" fill="#042C53">RecordingScreen</text>
<text x="564" y="124" fill="#0C447C" font-size="10">grava · detecta truncamento</text>

<rect x="646" y="86" width="132" height="52" rx="8" fill="#FFFFFF" stroke="#185FA5"/>
<text x="712" y="108" font-weight="bold" fill="#042C53">ProcessingScreen</text>
<text x="712" y="124" fill="#0C447C" font-size="10">7 etapas · erro por código</text>

<rect x="796" y="86" width="114" height="52" rx="8" fill="#FFFFFF" stroke="#185FA5"/>
<text x="853" y="108" font-weight="bold" fill="#042C53">ResultScreen</text>
<text x="853" y="124" fill="#0C447C" font-size="10">transcrição · perguntas</text>
</g>

<line x1="178" y1="112" x2="194" y2="112" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow5)"/>
<line x1="324" y1="112" x2="340" y2="112" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow5)"/>
<line x1="482" y1="112" x2="498" y2="112" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow5)"/>
<line x1="628" y1="112" x2="644" y2="112" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow5)"/>
<line x1="778" y1="112" x2="794" y2="112" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow5)"/>

<rect x="50" y="146" width="880" height="24" rx="6" fill="#FFFFFF" stroke="#185FA5" stroke-dasharray="3,2"/>
<text x="60" y="162" font-size="10.5" fill="#0C447C">ParticipantsScreen — cadastro de participantes e amostras de voz; alcançável da HomeScreen e da MeetingSetupScreen, fora do fluxo de uma reunião.</text>

<line x1="480" y1="180" x2="480" y2="198" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow5)"/>

<!-- Services -->
<rect x="30" y="200" width="900" height="150" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="50" y="222" font-size="13.5" font-weight="bold" fill="#173404">lib/services — integração com a API e com o aparelho</text>

<g font-size="11" text-anchor="middle">
<rect x="50" y="234" width="207" height="48" rx="8" fill="#FFFFFF" stroke="#3B6D11"/>
<text x="153" y="252" font-weight="bold" fill="#173404">auth_service</text>
<text x="153" y="266" font-size="9.5" fill="#3B6D11">/auth/* · erro de e-mail no campo</text>

<rect x="273" y="234" width="207" height="48" rx="8" fill="#FFFFFF" stroke="#3B6D11"/>
<text x="376" y="252" font-weight="bold" fill="#173404">upload_service</text>
<text x="376" y="266" font-size="9.5" fill="#3B6D11">participants (JSON) · 413 · tipada</text>

<rect x="496" y="234" width="207" height="48" rx="8" fill="#FFFFFF" stroke="#3B6D11"/>
<text x="599" y="252" font-weight="bold" fill="#173404">status_service</text>
<text x="599" y="266" font-size="9.5" fill="#3B6D11">WS em laço + polling 3s · removed</text>

<rect x="719" y="234" width="191" height="48" rx="8" fill="#FFFFFF" stroke="#3B6D11"/>
<text x="814" y="252" font-weight="bold" fill="#173404">participant_service</text>
<text x="814" y="266" font-size="9.5" fill="#3B6D11">GET /participants · fila de exclusão</text>

<rect x="50" y="290" width="207" height="48" rx="8" fill="#FFFFFF" stroke="#3B6D11"/>
<text x="153" y="308" font-weight="bold" fill="#173404">audio_service · background</text>
<text x="153" y="322" font-size="9.5" fill="#3B6D11">WAV 16kHz mono · foreground svc</text>

<rect x="273" y="290" width="207" height="48" rx="8" fill="#FFFFFF" stroke="#3B6D11"/>
<text x="376" y="308" font-weight="bold" fill="#173404">offline_service</text>
<text x="376" y="322" font-size="9.5" fill="#3B6D11">LocalResultCache · demo atrás de gate</text>

<rect x="496" y="290" width="207" height="48" rx="8" fill="#FFFFFF" stroke="#3B6D11"/>
<text x="599" y="308" font-weight="bold" fill="#173404">meeting_service</text>
<text x="599" y="322" font-size="9.5" fill="#3B6D11">histórico local (GET /meetings não usado)</text>

<rect x="719" y="290" width="191" height="48" rx="8" fill="#FFFFFF" stroke="#3B6D11"/>
<text x="814" y="308" font-weight="bold" fill="#173404">job_errors</text>
<text x="814" y="322" font-size="9.5" fill="#3B6D11">7 códigos → português</text>
</g>

<line x1="250" y1="350" x2="250" y2="376" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow5)"/>
<text x="258" y="368" font-size="9.5" fill="#444441">rede</text>
<line x1="720" y1="350" x2="720" y2="376" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow5)"/>
<text x="728" y="368" font-size="9.5" fill="#444441">disco</text>

<!-- Gates -->
<rect x="30" y="378" width="470" height="118" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.6"/>
<text x="50" y="400" font-size="13" font-weight="bold" fill="#04342C">api_client.dart — dono do par de tokens</text>
<g font-size="10.5" fill="#04342C">
<text x="50" y="420">Único ponto que escreve Authorization: Bearer.</text>
<text x="50" y="438">Renova 2 min antes de vencer, não no 401.</text>
<text x="50" y="456">Uma renovação por vez (o refresh é revogado no uso).</text>
<text x="50" y="474">Falha de rede não desloga; onSessionExpired → login.</text>
<text x="50" y="490" font-size="9.5" fill="#0F6E56">Nenhum Dio avulso: uma segunda cópia do token dessincroniza na 1ª renovação.</text>
</g>

<rect x="520" y="378" width="410" height="118" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="1.6"/>
<text x="540" y="400" font-size="13" font-weight="bold" fill="#4A1B0C">local_scope.dart — escopo por usuário</text>
<g font-size="10.5" fill="#4A1B0C">
<text x="540" y="420">Toda chave vira u&lt;user_id&gt;:&lt;nome&gt;.</text>
<text x="540" y="438">Histórico · participantes · exclusões pendentes ·</text>
<text x="540" y="452">cache de resultado.</text>
<text x="540" y="470">Sessão anônima tem escopo próprio.</text>
<text x="540" y="490" font-size="9.5" fill="#993C1D">Sem isso, quem entrasse depois leria a transcrição de quem entrou antes.</text>
</g>

<!-- Config e models -->
<rect x="30" y="512" width="470" height="82" rx="12" fill="#F1EFE8" stroke="#9CA3AF" stroke-width="1"/>
<text x="50" y="533" font-size="12.5" font-weight="bold" fill="#374151">lib/config.dart</text>
<g font-size="10.5" fill="#444441">
<text x="50" y="551">SCITECH_API_BASE_URL / SCITECH_WS_BASE_URL</text>
<text x="50" y="568">via --dart-define (default de emulador: 10.0.2.2:8000)</text>
<text x="50" y="585">SCITECH_DEMO_MODE — gate de compilação, nunca fallback de rede</text>
</g>

<rect x="520" y="512" width="410" height="82" rx="12" fill="#F1EFE8" stroke="#9CA3AF" stroke-width="1"/>
<text x="540" y="533" font-size="12.5" font-weight="bold" fill="#374151">lib/models</text>
<g font-size="10.5" fill="#444441">
<text x="540" y="551">participant.dart — hasVoiceProfile = servidor OU WAV local</text>
<text x="540" y="568">meeting_result.dart — cluster/participant_id/identified/</text>
<text x="540" y="585">confidence · QuestionType(explicit/implicit) · ResultMetadata</text>
</g>

</svg>
