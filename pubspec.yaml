name: app
description: App de captura e análise de reuniões (transcrição, diarização e extração de perguntas)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  record: ^7.0.0              # captura de áudio
  dio: ^5.4.0                 # upload HTTP
  web_socket_channel: ^2.4.0  # status em tempo real
  permission_handler: ^11.3.0 # permissão de microfone
  path_provider: ^2.1.2       # diretório para o arquivo
  flutter_background: ^1.3.0+1 # foreground service no Android
  wakelock_plus: ^1.2.5       # evita que o app durma durante a gravação
  shared_preferences: ^2.3.0  # persistência de sessão
  google_fonts: ^6.2.1         # tipografia Inter
  flutter_animate: ^4.5.0      # animações declarativas
  url_launcher: ^6.3.1         # abrir app de e-mail (mailto:)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
